services:

  # ── Base de datos ──────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: movie_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Streaming ──────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: movie_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: movie_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dos listeners: uno para el host (localhost:9092) y otro para la red Docker (kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: cinerec_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: cinerec
      MONGO_URI: mongodb://mongodb:27017
      DATABASE_NAME: movie_recommender
      KAFKA_SERVER: kafka:29092
      KAFKA_TOPIC: movie_ratings
      SECRET_KEY: ${SECRET_KEY:-cinerec-dev-secret-cambiar-en-produccion}


  # ── Consumidor Kafka → MongoDB ─────────────────────────────────────────────
  consumer:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: cinerec_consumer
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DATABASE_NAME: movie_recommender
      KAFKA_SERVER: kafka:29092
      KAFKA_TOPIC: movie_ratings


  # ── Frontend (nginx) ───────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: cinerec_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend


  # ── Dashboard NodeRED ──────────────────────────────────────────────────────
  nodered:
    build: ./nodered
    container_name: movie_nodered
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "1881:1880"
    environment:
      TZ: Europe/Madrid


volumes:
  mongo_data:
