<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineRec — Acceso</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="logo-title">🎬 <b>Cine</b>Rec</div>
        <div class="logo-sub">Tu recomendador personal de películas</div>
      </div>

      <!-- Card -->
      <div class="auth-card">

        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login" onclick="cambiarPestana('login')">Iniciar sesión</button>
          <button class="auth-tab" id="tab-register" onclick="cambiarPestana('register')">Registrarse</button>
        </div>

        <!-- Mensaje de error/éxito global -->
        <div id="auth-alert" style="display:none;"></div>

        <!-- ===== FORM LOGIN ===== -->
        <form class="auth-form active" id="form-login" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email">Correo electrónico</label>
            <input
              type="email"
              id="login-email"
              class="form-input"
              placeholder="usuario@ejemplo.com"
              autocomplete="email"
              required
            />
            <div class="form-error" id="login-email-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Contraseña</label>
            <div class="password-wrap">
              <input
                type="password"
                id="login-password"
                class="form-input"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button type="button" class="btn-eye" onclick="alternarContrasena('login-password', this)" title="Mostrar/ocultar contraseña">👁️</button>
            </div>
            <div class="form-error" id="login-password-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="btn-login">
            Iniciar sesión
          </button>

          <div class="auth-divider">o</div>
          <p style="text-align:center; font-size:0.85rem; color:var(--text-muted);">
            ¿No tienes cuenta?
            <a href="#" onclick="cambiarPestana('register'); return false;">Regístrate gratis</a>
          </p>
        </form>

        <!-- ===== FORM REGISTER ===== -->
        <form class="auth-form" id="form-register" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="reg-name">Nombre</label>
              <input
                type="text"
                id="reg-name"
                class="form-input"
                placeholder="Tu nombre"
                autocomplete="given-name"
                required
              />
              <div class="form-error" id="reg-name-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-apellidos">Apellidos</label>
              <input
                type="text"
                id="reg-apellidos"
                class="form-input"
                placeholder="Tus apellidos"
                autocomplete="family-name"
                required
              />
              <div class="form-error" id="reg-apellidos-error"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="reg-edad">Edad</label>
              <input
                type="number"
                id="reg-edad"
                class="form-input"
                placeholder="Tu edad"
                min="13"
                max="120"
                required
              />
              <div class="form-error" id="reg-edad-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-genero">Género</label>
              <select id="reg-genero" class="form-input form-select" required>
                <option value="">Selecciona...</option>
                <option value="hombre">Hombre</option>
                <option value="mujer">Mujer</option>
                <option value="otro">Otro</option>
                <option value="no_especificado">Prefiero no decirlo</option>
              </select>
              <div class="form-error" id="reg-genero-error"></div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Correo electrónico</label>
            <input
              type="email"
              id="reg-email"
              class="form-input"
              placeholder="usuario@ejemplo.com"
              autocomplete="email"
              required
            />
            <div class="form-error" id="reg-email-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Contraseña</label>
            <div class="password-wrap">
              <input
                type="password"
                id="reg-password"
                class="form-input"
                placeholder="Mínimo 6 caracteres"
                autocomplete="new-password"
                required
              />
              <button type="button" class="btn-eye" onclick="alternarContrasena('reg-password', this)" title="Mostrar/ocultar contraseña">👁️</button>
            </div>
            <div class="form-error" id="reg-password-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password2">Confirmar contraseña</label>
            <div class="password-wrap">
              <input
                type="password"
                id="reg-password2"
                class="form-input"
                placeholder="Repite tu contraseña"
                autocomplete="new-password"
                required
              />
              <button type="button" class="btn-eye" onclick="alternarContrasena('reg-password2', this)" title="Mostrar/ocultar contraseña">👁️</button>
            </div>
            <div class="form-error" id="reg-password2-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="btn-register">
            Crear cuenta
          </button>

          <div class="auth-divider">o</div>
          <p style="text-align:center; font-size:0.85rem; color:var(--text-muted);">
            ¿Ya tienes cuenta?
            <a href="#" onclick="cambiarPestana('login'); return false;">Inicia sesión</a>
          </p>
        </form>

      </div>
      <!-- /auth-card -->

    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/auth.js"></script>
</body>
</html>
